name: Repair and Build RedBox

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair Compose compile errors
        shell: python
        run: |
          from pathlib import Path
          import re

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              original = s
              for old, new in replacements:
                  s = s.replace(old, new)
              if s != original:
                  p.write_text(s, encoding='utf-8')

          patch('app/src/main/java/ir/redlighte/redbox/RedBoxTheme.kt', [
              ('import androidx.compose.ui.unit.dp\n', 'import androidx.compose.ui.unit.dp\nimport androidx.compose.foundation.shape.RoundedCornerShape\n')
          ])

          patch('app/src/main/java/ir/redlighte/redbox/MainActivity.kt', [
              ('import androidx.compose.ui.unit.LocalLayoutDirection\n', 'import androidx.compose.ui.platform.LocalLayoutDirection\n'),
              ('import androidx.compose.ui.platform.LocalContext\n', 'import androidx.compose.ui.platform.LocalContext\nimport androidx.compose.runtime.CompositionLocalProvider\n'),
              ('import androidx.compose.runtime.CompositionLocalProvider\nimport androidx.compose.runtime.CompositionLocalProvider\n', 'import androidx.compose.runtime.CompositionLocalProvider\n'),
          ])

          for path in [
              'app/src/main/java/ir/redlighte/redbox/MainActivity.kt',
              'app/src/main/java/ir/redlighte/redbox/NotesScreen.kt',
              'app/src/main/java/ir/redlighte/redbox/AboutScreen.kt',
              'app/src/main/java/ir/redlighte/redbox/MoreTools.kt',
          ]:
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              # Named arguments must not be followed by positional arguments.
              s = re.sub(r'tint=([^,\)]+),Modifier\.', r'tint=\1,modifier=Modifier.', s)
              s = re.sub(r'tint=([^,\)]+), Modifier\.', r'tint=\1, modifier = Modifier.', s)
              s = re.sub(r'fontWeight=([^,\)]+),Modifier\.', r'fontWeight=\1,modifier=Modifier.', s)
              p.write_text(s, encoding='utf-8')

          # Fix common Material3 Card positional-shape mistakes introduced by the rounded UI pass.
          for path in [
              'app/src/main/java/ir/redlighte/redbox/MainActivity.kt',
              'app/src/main/java/ir/redlighte/redbox/NotesScreen.kt',
              'app/src/main/java/ir/redlighte/redbox/AboutScreen.kt',
              'app/src/main/java/ir/redlighte/redbox/MoreTools.kt',
          ]:
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'Card\((Modifier\.fillMaxWidth\(\)),(RoundedCornerShape\([^\n\)]*\))', r'Card(modifier=\1,shape=\2', s)
              s = re.sub(r'Card\(onClick=([^,]+),(Modifier\.fillMaxWidth\(\)),(RoundedCornerShape\([^\n\)]*\))', r'Card(onClick=\1,modifier=\2,shape=\3', s)
              p.write_text(s, encoding='utf-8')

          # MainActivity has a few very compact Card calls whose shape is positional.
          p = Path('app/src/main/java/ir/redlighte/redbox/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'Card\((Modifier\.fillMaxWidth\(\)),(RoundedCornerShape\([^\n\)]*\))', r'Card(modifier=\1,shape=\2', s)
          p.write_text(s, encoding='utf-8')

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          arguments: :app:assembleDebug --no-daemon

      - name: Commit repaired sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java
          git diff --cached --quiet || git commit -m "fix: repair Persian rounded Compose build"
          git push

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RedBox-0.10.0-persian-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Remove temporary repair workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/repair-build.yml
          git commit -m "chore: remove temporary repair workflow"
          git push
